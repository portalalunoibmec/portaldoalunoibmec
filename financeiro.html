<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMEC - Financeiro</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="finance-page">
    <!-- Seção do Topo (Fundo Azul) -->
    <div class="top-section finance-top">
      <div class="container finance-container">
        <header class="finance-header">
          <div class="finance-header-top">
            <div class="user-texts">
              <h1>Olá, Cesar</h1>
              <p>Administração</p>
            </div>
            <div class="avatar">CH</div>
          </div>
          <h2 class="section-title">Informações financeiras</h2>
        </header>
      </div>
    </div>

    <!-- Conteúdo Principal com Cards (Quadrados brancos) -->
    <main class="main-content finance-content">
      <div class="container finance-container">
        <div class="finance-grid">
          <a
            href="mensalidades.html"
            style="text-decoration: none; color: inherit"
          >
            <article class="finance-card">
              <i class="fas fa-file-invoice-dollar icon-card"></i>
              <h3>Minhas<br />mensalidades</h3>
            </article>
          </a>
          <article class="finance-card">
            <i class="fas fa-sync-alt icon-card"></i>
            <h3>Minha<br />renovação</h3>
          </article>

          <article class="finance-card">
            <i class="fas fa-id-card icon-card"></i>
            <h3>Portal de<br />negociação</h3>
          </article>
        </div>
      </div>
    </main>

    <!-- Navegação Inferior -->
    <nav class="bottom-nav">
      <ul class="nav-container">
        <li>
          <a href="index.html">
            <div class="icon-plain"><i class="fas fa-home"></i></div>
            <span>Início</span>
          </a>
        </li>
        <li class="active">
          <a href="#">
            <div class="icon-circle"><i class="fas fa-calculator"></i></div>
            <span>Financeiro</span>
          </a>
        </li>
        <li>
          <a href="#">
            <div class="icon-plain"><i class="fas fa-question-circle"></i></div>
            <span>Suporte</span>
          </a>
        </li>
        <li>
          <a href="menu.html">
            <div class="icon-plain"><i class="fas fa-bars"></i></div>
            <span>Menu</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="system-bar-bottom"></div>
  </body>
</html>
